<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CUBO 2 — Configurateur 3D | 5426 Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;600;700&family=Jacquard+12&family=Source+Sans+3:wght@400;500;600;700&family=UnifrakturMaguntia&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="./bundle.js"></script>
    <link rel="stylesheet" crossorigin href="./asset-index.css">
  </head>
  <body>
    <span style="font-family: 'Jacquard 12', serif; position: absolute; opacity: 0; pointer-events: none" aria-hidden="true">5426 studio</span>

    <section id="home-screen" class="home-screen is-hidden">
      <div id="cathedrale-viewport" class="cathedrale-viewport"></div>
      <div class="home-overlay">
        <header class="home-header">
          <h1 class="home-title">5426 Studio</h1>
          <p class="home-subtitle">Conception Acoustique &amp; Impression 3D sur mesure</p>
        </header>
        <footer class="home-footer">
          <a href="https://www.5426.fr/" target="_top" id="btn-enter-shop" class="btn-primary home-cta">
            Accéder à la boutique →
          </a>
          <button type="button" id="btn-open-configurator" class="btn-secondary home-cta-sec">
            Configurer CUBO 2
          </button>
        </footer>
      </div>
    </section>

    <div id="app" class="app-layout">
      <main class="stage-area">
        <div id="viewport" class="viewport"></div>

        <div id="loader" class="loader-overlay">
          <div class="spinner"></div>
          <span>Chargement de la scène 3D CUBO 2…</span>
        </div>

        <div class="cam-bar" role="toolbar" aria-label="Vues caméra">
          <button class="cam-pill active" data-cam="three_quarter">3/4 Studio</button>
          <button class="cam-pill" data-cam="front">Face</button>
          <button class="cam-pill" data-cam="profile">Profil</button>
          <button class="cam-pill" data-cam="top">Dessus</button>
        </div>

        <div class="orbit-hint">Glisser pour pivoter • Molette pour zoomer</div>
      </main>

      <aside id="panel" class="config-panel"></aside>
    </div>
  </body>
</html>
